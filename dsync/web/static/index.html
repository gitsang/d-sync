<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-Sync · 同步看板</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h5l2 2.5h8A1.5 1.5 0 0 1 21 10v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/>
          <path d="M12 11v5M9.5 13.5 12 16l2.5-2.5"/>
        </svg>
      </div>
      <div>
        <h1>D-Sync 同步看板</h1>
        <p class="sub" id="subtitle">正在连接…</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="pill" id="conn-pill" data-state="connecting">
        <span class="dot"></span><span id="conn-text">连接中</span>
      </span>
      <button class="btn" id="btn-rescan" type="button">重新扫描</button>
      <button class="btn primary" id="btn-open-folder" type="button">打开目录</button>
    </div>
  </header>

  <!-- ============ 设备状态 ============ -->
  <section class="card">
    <div class="card-head">
      <h2>设备状态</h2>
      <span class="muted" id="device-count">0</span>
    </div>
    <div class="table-wrap">
      <table class="device-table">
        <thead>
          <tr>
            <th style="width:26%">设备名</th>
            <th style="width:16%">当前状态</th>
            <th style="width:34%">同步进度</th>
            <th style="width:24%">本次同步耗时</th>
          </tr>
        </thead>
        <tbody id="devices"></tbody>
      </table>
    </div>
  </section>

  <!-- ============ 选择设备 ============ -->
  <section class="card select-card">
    <div class="card-head">
      <h2>选择设备</h2>
      <span class="muted" id="selected-hint">未选择</span>
    </div>
    <div class="select-bar">
      <select id="card-select" aria-label="选择设备"></select>
      <button class="btn" id="btn-refresh-cards" type="button">刷新列表</button>
      <button class="btn primary" id="btn-sync-now" type="button" disabled>立即同步</button>
      <button class="btn ghost" id="btn-cancel-sync" type="button" disabled>取消同步</button>
    </div>
    <p class="hint">仅列出外置设备（U 盘、读卡器等）。</p>
  </section>

  <!-- ============ 配置区（无配置时不显示） ============ -->
  <section class="card editor-card" id="editor-card" hidden>
    <div class="card-head">
      <h2>同步配置</h2>
      <div class="head-tools">
        <span class="tag" id="config-target-tag">设备配置</span>
        <button class="btn small" id="btn-validate" type="button">校验</button>
        <button class="btn small primary" id="btn-save-config" type="button">保存配置</button>
      </div>
    </div>

    <p class="hint" id="config-hint"></p>
    <p class="hint" id="save-hint"></p>

    <label class="switch-row">
      <span class="switch">
        <input type="checkbox" id="auto-enable" checked>
        <span class="switch-track"></span>
      </span>
      <span class="switch-text">
        <b>自动同步</b>
        <span class="muted">开启后，插入该设备将自动开始同步；关闭后需手动点「立即同步」</span>
      </span>
    </label>

    <div class="editor-body">
      <div class="sub-head">
        <h3>全局设置</h3>
      </div>
      <div class="form-grid">
        <label class="field">
          <span class="field-label">目标根目录</span>
          <span class="input-with-btn">
            <input type="text" id="cfg-dest-root" placeholder="例如 D:/SD_Backup">
            <button class="btn tiny" id="btn-pick-dest-root" type="button" title="浏览文件夹">浏览…</button>
          </span>
          <span class="field-hint">规则中的相对目标路径基于此目录解析</span>
        </label>
        <label class="field">
          <span class="field-label">全局排除</span>
          <input type="text" id="cfg-exclude" placeholder="*.tmp, Thumbs.db">
          <span class="field-hint">逗号分隔，对所有规则生效</span>
        </label>
        <label class="field check-field">
          <span class="field-label">内容不同时覆盖</span>
          <span class="switch">
            <input type="checkbox" id="cfg-overwrite">
            <span class="switch-track"></span>
          </span>
          <span class="field-hint">关闭时保留已有文件；内容完全一致始终跳过</span>
        </label>
      </div>

      <div class="sub-head">
        <h3>规则列表</h3>
        <button class="btn small" id="btn-add-rule" type="button">+ 添加规则</button>
      </div>
      <div class="rule-table-wrap">
        <table class="rule-table">
          <thead>
            <tr>
              <th style="width:34%">源路径（设备内）</th>
              <th style="width:34%">目标路径</th>
              <th style="width:16%">排除</th>
              <th style="width:8%">启用</th>
              <th style="width:8%">覆盖</th>
              <th style="width:5%"></th>
            </tr>
          </thead>
          <tbody id="cfg-rules"></tbody>
        </table>
      </div>
      <p class="hint empty-hint" id="rules-empty">还没有规则，点击「添加规则」开始配置。</p>

      <div class="yaml-block">
        <div class="sub-head">
          <h3>YAML 预览</h3>
          <button class="btn small ghost" id="btn-copy-yaml" type="button">复制</button>
        </div>
        <pre class="yaml-preview" id="yaml-preview">—</pre>
      </div>
    </div>
  </section>

  <!-- ============ 无配置提示 ============ -->
  <section class="card empty-card" id="empty-card" hidden>
    <div class="card-head">
      <h2>尚未创建配置文件</h2>
    </div>
    <div class="empty-body">
      <p class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.7.9l.8 1.2H18a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
          <path d="M12 12v3M10.8 13.6 12 15l1.2-1.4"/>
        </svg>
      </p>
      <p class="empty-title" id="empty-title">这台设备还没有配置文件</p>
      <p class="empty-desc" id="empty-desc">创建一个 <code>dsync.yml</code>，写好源路径与目标路径后即可自动同步。</p>
      <button class="btn primary" id="btn-create-config" type="button">创建配置文件</button>
      <p class="hint" id="create-hint"></p>
    </div>
  </section>

  <!-- ============ 运行日志 ============ -->
  <section class="card">
    <div class="card-head">
      <h2>运行日志</h2>
      <div class="head-tools">
        <div class="log-filters" id="log-filters" role="group" aria-label="日志等级过滤">
          <label class="check lvl-debug"><input type="checkbox" data-log-level="debug" checked> DEBUG</label>
          <label class="check lvl-info"><input type="checkbox" data-log-level="info" checked> INFO</label>
          <label class="check lvl-warn"><input type="checkbox" data-log-level="warn" checked> WARN</label>
          <label class="check lvl-error"><input type="checkbox" data-log-level="error" checked> ERROR</label>
        </div>
        <label class="check"><input type="checkbox" id="autoscroll" checked> 自动滚动</label>
        <button class="btn small" id="btn-clear-log" type="button">清空</button>
      </div>
    </div>
    <div class="log" id="log"></div>
  </section>

  <!-- ============ 历史记录 ============ -->
  <section class="card">
    <div class="card-head">
      <h2>历史记录</h2>
      <span class="muted" id="history-count">0</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>时间</th><th>设备</th><th>结果</th><th>复制</th><th>跳过</th><th>耗时</th>
          </tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </section>

  <footer class="footer">
    <span id="footer-info">D-Sync v1.0.0</span>
    <span class="muted">本页仅在本机 127.0.0.1 提供服务</span>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
